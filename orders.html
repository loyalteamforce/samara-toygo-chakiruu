<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Заказы · Samara</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=39">
<link rel="stylesheet" href="css/admin.css?v=39">
</head>
<body class="adm gated">

<div class="gate" id="gate">
  <form class="gate-box" id="gateForm">
    <img src="logo/mark.svg" alt="">
    <h1>SAMARA</h1>
    <p>Заказы.<br>Введите код доступа.</p>
    <input id="gatePin" type="password" autocomplete="current-password" placeholder="Код доступа" required>
    <p class="gate-err" id="gateErr" hidden>Неверный код</p>
    <button class="btn btn-solid" type="submit">Войти</button>
  </form>
</div>

<header class="adm-top">
  <div class="wrap adm-top-in">
    <a class="logo" href="index.html"><span class="logo-mark"><img src="logo/mark-sm.svg" alt="" width="30" height="30"></span><span><b>Samara</b><small>заказы</small></span></a>
    <div class="adm-actions">
      <a class="btn btn-sm btn-ghost" href="admin.html">Конструктор</a>
      <a class="btn btn-sm btn-ghost" href="studio.html">Студия</a>
      <button type="button" class="btn btn-sm btn-ghost" id="btnRefresh">Обновить</button>
    </div>
  </div>
</header>

<main class="wrap oa">
  <div class="oa-top">
    <div class="tpl-filter" id="oaFilter">
      <button type="button" class="chip on" data-f="all">Все</button>
      <button type="button" class="chip" data-f="new">Ожидают оплаты</button>
      <button type="button" class="chip" data-f="paid">Оплачены</button>
      <button type="button" class="chip" data-f="cancelled">Отменены</button>
    </div>
    <p class="hint" id="oaCount"></p>
  </div>
  <div id="oaList" class="oa-list"></div>

  <section class="card oa-prices">
    <h2>Цены (сом)</h2>
    <p class="hint">Меняется сразу: новые заказы будут по новой цене. Старые заказы остаются по своей цене.</p>
    <div class="row3">
      <label>Сайт <input id="pSite" inputmode="numeric"></label>
      <label>Видео <input id="pVideo" inputmode="numeric"></label>
      <label>Сайт + видео <input id="pBoth" inputmode="numeric"></label>
    </div>
    <button type="button" class="btn btn-sm btn-solid" id="btnPrices">Сохранить цены</button>
    <p class="hint" id="pMsg"></p>
  </section>
</main>

<script src="js/config.js?v=39"></script>
<script src="js/orders.js?v=39"></script>
<script src="js/orders-admin.js?v=39"></script>
</body>
</html>
