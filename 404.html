<div id="m"><p>Чакыруу ачылууда…</p><p>Открываем приглашение…</p></div>
<script>
(function () {
  var m = location.pathname.match(/^\/([iv])\/([A-Za-z0-9-]+)\/?$/);
  if (m) {
    var q = new URLSearchParams(location.search);
    q.set("i", m[2].toLowerCase());
    location.replace("/" + (m[1] === "v" ? "video.html" : "davet.html") + "?" + q.toString());
    return;
  }
  document.getElementById("m").innerHTML = '<p>Бет табылган жок · Страница не найдена</p><p><a href="/">samaratc.store</a></p>';
})();
</script>
